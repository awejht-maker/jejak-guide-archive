<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제작가이드 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --bg:#EFF1EC;
    --paper:#FFFFFF;
    --ink:#1B1D1F;
    --ink-soft:#5B5F5A;
    --line:#D8D6CD;
    --accent:#2B4C8C;
    --accent-soft:#EAF0FB;
    --warm:#B8602A;
    --warm-soft:#FBEEE4;
    --ok:#2F7A4F;
    --bad:#B3413A;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:#fff;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  /* ---------- layout shell ---------- */
  .shell{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .body-row{
    display:grid;
    grid-template-columns:260px 1fr;
    flex:1;
  }
  @media (max-width:860px){
    .body-row{grid-template-columns:1fr;}
    .sidebar{position:sticky; top:0; z-index:20; max-height:none;}
  }
  /* ---------- header ---------- */
  .topbar{
    grid-column:1 / -1;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    padding:12px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    line-height:1.3;
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 4px;
    font-weight:600;
  }
  .brand-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:-.01em;
  }
  .brand-sub{
    margin:4px 0 0;
    color:var(--ink-soft);
    font-size:12.5px;
  }
  .topbar-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn{
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    padding:9px 14px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .btn:hover{background:var(--ink); color:var(--paper);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{background:#1e3a6e;}
  .btn-ghost{border-color:var(--line); color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--bg); color:var(--ink);}
  .btn-sm{padding:6px 10px; font-size:12px;}
  input[type=file]{display:none;}
  /* ---------- sidebar ---------- */
  .sidebar{
    background:var(--paper);
    border-right:1px solid var(--line);
    padding:14px 0;
  }
  .sidebar-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:0 20px 10px;
  }
  .media-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px 20px;
    border-left:3px solid transparent;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
  }
  .media-item:hover{background:var(--bg);}
  .media-item.active{
    border-left-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:600;
  }
  .media-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--bg);
    padding:1px 6px;
    border-radius:10px;
  }
  .media-item.active .media-count{background:#fff; color:var(--accent);}
  .media-del{
    opacity:0;
    border:none;
    background:none;
    color:#b3413a;
    font-size:13px;
    padding:2px 4px;
    line-height:1;
  }
  .media-edit{
    opacity:0;
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:13px;
    padding:2px 4px;
    line-height:1;
  }
  .media-item:hover .media-del, .media-item:hover .media-edit{opacity:1;}
  .media-edit:hover{color:var(--accent);}
  .sidebar-divider{height:1px; background:var(--line); margin:14px 20px;}
  .add-media-row{
    display:flex; gap:6px; padding:0 20px;
  }
  .add-media-row input{
    flex:1; min-width:0; border:1px solid var(--line); border-radius:var(--radius);
    padding:7px 8px; font-size:13px; font-family:inherit;
  }
  /* ---------- main ---------- */
  main{padding:16px 30px 60px;}
  .main-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:14px;
  }
  .main-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px; font-weight:600; margin:0;
  }
  .search-box{
    border:1px solid var(--line); border-radius:var(--radius); background:var(--paper);
    padding:8px 12px; font-size:13px; width:240px; font-family:inherit;
  }
  .empty-state{
    border:1px dashed var(--line);
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    background:var(--paper);
  }
  .empty-state b{display:block; color:var(--ink); font-family:'Space Grotesk',sans-serif; font-size:16px; margin-bottom:6px;}
  .guide-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
    gap:16px;
  }
  /* card = index-card / catalog card signature */
  .card{
    position:relative;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 6px, var(--bg) 6px, var(--bg) 10px) top / 100% 1px no-repeat,
      var(--paper);
    border:1px solid var(--line);
    border-top:none;
    padding:18px 16px 16px;
  }
  .card::before{
    content:"";
    display:block;
    height:1px;
    background:var(--line);
    margin:0 -16px 14px;
  }
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .card-media-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent);
  }
  .stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--bg);
    padding:3px 7px;
    border-radius:3px;
    white-space:nowrap;
  }
  .card-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px; font-weight:600;
    margin:10px 0 6px;
    line-height:1.3;
  }
  .card-note{
    font-size:12.5px; color:var(--ink-soft); margin:0 0 12px; line-height:1.5;
    min-height:0;
  }
  .type-badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:600; letter-spacing:.06em;
    padding:3px 7px; border-radius:2px; margin-bottom:10px;
  }
  .type-badge.link{background:var(--accent-soft); color:var(--accent);}
  .type-badge.file{background:var(--warm-soft); color:var(--warm);}
  .card-actions{
    display:flex; gap:6px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
  }
  .missing-file{
    font-size:12px; color:var(--warm); font-family:'IBM Plex Mono',monospace;
  }
  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(27,29,31,.45);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper); border:1px solid var(--line);
    width:100%; max-width:440px;
    padding:24px;
    max-height:90vh; overflow-y:auto;
  }
  .modal h3{
    font-family:'Space Grotesk',sans-serif; margin:0 0 16px; font-size:18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:var(--ink-soft);
  }
  .field input[type=text], .field input[type=url], .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:var(--radius);
    padding:9px 10px; font-size:13.5px; font-family:inherit; background:var(--paper); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:56px;}
  .type-toggle{display:flex; gap:8px;}
  .type-toggle label{
    flex:1; border:1px solid var(--line); border-radius:var(--radius); padding:8px; text-align:center;
    font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .type-toggle input{display:none;}
  .type-toggle input:checked + span{color:var(--accent);}
  .type-toggle label.checked{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .file-drop{
    border:1px dashed var(--line); border-radius:var(--radius); padding:16px; text-align:center;
    font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .file-drop.has-file{border-color:var(--ok); color:var(--ok); background:#f2f8f4;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5;}
  .modal-danger{color:#b3413a; font-size:12.5px; margin-top:16px; cursor:pointer; text-align:right;}
  /* ---------- spec table ---------- */
  .spec-section{
    background:var(--paper); border:1px solid var(--line);
    padding:16px 18px; margin-bottom:20px;
  }
  .spec-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
  }
  .spec-title{
    font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; margin:0;
  }
  .spec-empty{
    font-size:13px; color:var(--ink-soft); padding:14px 0;
  }
  table.spec-table{
    width:100%; border-collapse:collapse; font-size:13px;
  }
  table.spec-table th{
    background:#FBF6D9; text-align:left; font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft);
    padding:8px 10px; border:1px solid var(--line);
  }
  table.spec-table td{
    padding:9px 10px; border:1px solid var(--line); vertical-align:top; line-height:1.5;
  }
  .spec-row-actions{white-space:nowrap; width:56px;}
  .spec-row-actions button{
    border:none; background:none; color:var(--ink-soft); font-size:13px; padding:2px 4px;
  }
  .spec-row-actions button:hover{color:var(--ink);}
  table.spec-table td a{color:var(--accent); text-decoration:underline; word-break:break-all;}
  /* ---------- spec item rows (modal) ---------- */
  .spec-item-row{
    display:grid; grid-template-columns:1fr 1.6fr auto; gap:6px; align-items:start; margin-bottom:6px;
  }
  .spec-item-row input[type=text]{
    width:100%; border:1px solid var(--line); border-radius:var(--radius);
    padding:8px 9px; font-size:13px; font-family:inherit;
  }
  .spec-item-row textarea{
    width:100%; border:1px solid var(--line); border-radius:var(--radius);
    padding:8px 9px; font-size:13px; font-family:inherit; resize:vertical; min-height:36px;
  }
  .spec-item-row .item-del{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    border-radius:var(--radius); width:32px; height:32px; font-size:13px;
  }
  .spec-item-row .item-del:hover{color:var(--bad); border-color:var(--bad);}
  /* ---------- export modal ---------- */
  .export-media-list{
    max-height:280px; overflow-y:auto; border:1px solid var(--line); margin-bottom:4px;
  }
  .export-media-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    border-bottom:1px solid var(--line); font-size:13.5px; cursor:pointer;
  }
  .export-media-row:last-child{border-bottom:none;}
  .export-media-row input{accent-color:var(--accent);}
  .export-media-row span:nth-child(2){flex:1;}
  .export-media-row .media-count{background:var(--bg);}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:var(--radius);
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:200; font-family:'IBM Plex Mono',monospace; max-width:80vw;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <h1 class="brand-title">매체별 제작가이드</h1>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" id="btnRefresh" title="구글 시트에서 다시 불러오기">↻ 새로고침</button>
      <button class="btn btn-ghost" id="btnTemplate">가이드 템플릿</button>
      <button class="btn btn-ghost" id="btnExcelImport">가이드 일괄 업로드</button>
      <input type="file" id="excelInput" accept=".xlsx,.xls">
      <button class="btn btn-ghost" id="btnSpecTemplate">규격 템플릿</button>
      <button class="btn btn-ghost" id="btnSpecExcelImport">규격 일괄 업로드</button>
      <input type="file" id="specExcelInput" accept=".xlsx,.xls">
      <button class="btn btn-ghost" id="btnExport">엑셀로 내보내기</button>
      <button class="btn btn-primary" id="btnAddGuide">+ 가이드 추가</button>
    </div>
  </div>
  <div class="body-row">
  <aside class="sidebar">
    <p class="sidebar-label">매체 (Media)</p>
    <div id="mediaList"></div>
    <div class="sidebar-divider"></div>
    <div class="add-media-row">
      <input type="text" id="newMediaInput" placeholder="매체명 추가...">
      <button class="btn btn-sm btn-ghost" id="btnAddMedia">추가</button>
    </div>
  </aside>
  <main>
    <div class="main-head">
      <h2 class="main-title" id="mainTitle">전체 가이드</h2>
      <input type="text" class="search-box" id="searchBox" placeholder="가이드명 · 매체명 · 비고 검색...">
    </div>
    <div class="spec-section" id="specSection" style="display:none;"></div>
    <div id="guideArea"></div>
  </main>
  </div>
</div>
<!-- guide modal -->
<div class="overlay" id="guideOverlay">
  <div class="modal">
    <h3 id="guideModalTitle">가이드 추가</h3>
    <form id="guideForm">
      <input type="hidden" id="guideId" value="">
      <div class="field">
        <label>매체</label>
        <select id="fMedia" required></select>
      </div>
      <div class="field">
        <label>가이드명</label>
        <input type="text" id="fTitle" placeholder="예: 인스타 피드 이미지 규격" required>
      </div>
      <div class="field">
        <label>제공 방식</label>
        <div class="type-toggle">
          <label id="typeLinkLabel" class="checked"><input type="radio" name="fType" value="link" checked><span>링크</span></label>
          <label id="typeFileLabel"><input type="radio" name="fType" value="file"><span>파일</span></label>
        </div>
      </div>
      <div class="field" id="linkField" style="display:block;">
        <label>링크 URL</label>
        <input type="url" id="fUrl" placeholder="https://...">
      </div>
      <div class="field" id="fileField" style="display:none;">
        <label>파일 업로드</label>
        <div class="file-drop" id="fileDrop">클릭해서 파일 선택</div>
        <input type="file" id="fFile">
        <p class="hint" id="fileHint"></p>
        <p class="hint">파일은 구글시트 셀에 직접 저장돼요 (최대 약 29KB). 더 큰 파일은 링크 공유를 이용해주세요.</p>
      </div>
      <div class="field">
        <label>비고 (선택)</label>
        <textarea id="fNote" placeholder="규격, 주의사항 등"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="btnCancelGuide">취소</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btnSaveUpdate" style="display:none;">업데이트</button>
        <button type="button" class="btn btn-primary btn-sm" id="btnSaveAdd">추가</button>
      </div>
      <p class="modal-danger" id="btnDeleteGuide" style="display:none;">이 가이드 삭제</p>
    </form>
  </div>
</div>
<!-- spec (규격표) modal -->
<div class="overlay" id="specOverlay">
  <div class="modal">
    <h3 id="specModalTitle">규격 추가</h3>
    <form id="specForm">
      <input type="hidden" id="specId" value="">
      <div class="field">
        <label>지면</label>
        <input type="text" id="sSurface" placeholder="예: PC / Mobile" required>
      </div>
      <div class="field">
        <label>광고유형</label>
        <input type="text" id="sAdType" placeholder="예: VVC *트루뷰 인스트림 only">
      </div>
      <div class="field">
        <label>항목 목록</label>
        <div id="specItemsList"></div>
        <button type="button" class="btn btn-ghost btn-sm" id="btnAddItem" style="margin-top:4px;">+ 항목 추가</button>
        <p class="hint">각 줄이 엑셀 내보내기 시 별도 행으로 출력돼요. 내용칸에서 Ctrl+Enter로 줄바꿈을 넣을 수 있어요.</p>
      </div>
      <div class="field">
        <label>파일형식</label>
        <input type="text" id="sFileFormat" placeholder="예: text, jpg, mp4 등">
      </div>
      <div class="field">
        <label>비고 (선택)</label>
        <textarea id="sNote" placeholder="참고 링크나 메모 (URL을 입력하면 클릭해서 이동할 수 있어요)"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="btnCancelSpec">취소</button>
        <button type="submit" class="btn btn-primary btn-sm">저장</button>
      </div>
    </form>
  </div>
</div>
<!-- export modal -->
<div class="overlay" id="exportOverlay">
  <div class="modal">
    <h3>엑셀로 내보내기</h3>
    <p class="hint" style="margin-bottom:12px;">규격표가 입력된 매체만 내보낼 수 있어요. 원하는 매체를 선택하세요.</p>
    <div id="exportMediaList" class="export-media-list"><label class="export-media-row"><input type="checkbox" value="YouTube" checked="">
        <span>YouTube</span><span class="media-count">1건</span></label><label class="export-media-row"><input type="checkbox" value="Meta / Instagram" checked="">
        <span>Meta / Instagram</span><span class="media-count">2건</span></label><label class="export-media-row"><input type="checkbox" value="네이버 GFA" disabled="">
        <span>네이버 GFA</span><span class="media-count">0건</span></label><label class="export-media-row"><input type="checkbox" value="카카오" disabled="">
        <span>카카오</span><span class="media-count">0건</span></label><label class="export-media-row"><input type="checkbox" value="TikTok" disabled="">
        <span>TikTok</span><span class="media-count">0건</span></label><label class="export-media-row"><input type="checkbox" value="test" disabled="">
        <span>test</span><span class="media-count">0건</span></label><label class="export-media-row"><input type="checkbox" value="혜민" checked="">
        <span>혜민</span><span class="media-count">1건</span></label><label class="export-media-row"><input type="checkbox" value="토스" disabled="">
        <span>토스</span><span class="media-count">0건</span></label></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost btn-sm" id="btnCancelExport">취소</button>
      <button type="button" class="btn btn-primary btn-sm" id="btnDoExport">다운로드</button>
    </div>
  </div>
</div>
<div class="toast" id="toast">다운로드 완료</div>
<script>
(function(){
  "use strict";

  // ============================================================================
  // ⚙️ 구글 스프레드시트 연동 설정 (여기만 바꾸면 내 시트로 연결됩니다)
  // ============================================================================
  // 1) 데이터가 쌓일 스프레드시트의 ID. 시트 URL에서
  //    https://docs.google.com/spreadsheets/d/{이 부분}/edit  의 {이 부분}에 해당합니다.
  const GOOGLE_SHEET_ID = "1LTLh2Q7-KHs5k9rzlrpYxd6ZggDL6xmOR6Bb0TzFxoI";

  // 2) 데이터를 실제로 읽고 쓸 시트(탭) 이름. 없으면 자동으로 생성합니다.
  const GOOGLE_SHEET_NAME = "시트1";

  // 3) [필수] 구글 스프레드시트를 대신 읽고 써주는 "Apps Script 웹앱"의 배포 URL.
  //    https://script.google.com/macros/s/xxxxxxxxxxxxxxxx/exec 형태입니다.
  //    이 방식은 로그인 팝업이 전혀 필요 없습니다 — Apps Script를 배포한 본인 계정 권한으로
  //    시트를 대신 읽고 쓰기 때문에, 팀원들은 별도 구글 로그인/인증 절차 없이 바로 이 화면에서
  //    데이터를 조회·저장할 수 있습니다. 노션 iframe처럼 OAuth 팝업이 막히는 환경에서도 동작합니다.
  //    아래 "Apps Script 배포 방법" 안내에 따라 발급받은 뒤 이 값에 붙여넣으세요.
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzD5kABs0shSJi20ffxq5GPcfuChoWE_lb07SYvHweVXpi7L1Qy4wtjjgcFrUGbRZ27/exec";

  // ----------------------------------------------------------------------------
  // [Apps Script 배포 방법 — 최초 1회만 하면 됩니다]
  // 1. script.google.com 접속 → 새 프로젝트 생성 → 아래 코드를 Code.gs에 붙여넣기
  //    (전체 코드는 대화창에서 별도로 전달드린 "Code.gs" 스니펫을 사용하세요.
  //     SHEET_ID / SHEET_NAME 값을 위 GOOGLE_SHEET_ID / GOOGLE_SHEET_NAME과 동일하게 맞춰주세요.)
  // 2. 우측 상단 "배포" → "새 배포" → 유형: "웹 앱" 선택
  //    - 실행 계정: 나(Me)
  //    - 액세스 권한: 전체(Anyone)  ← 이래야 팀원들이 로그인 없이 접근 가능
  // 3. 배포 후 나오는 웹 앱 URL을 복사해서 위 APPS_SCRIPT_URL에 붙여넣기
  // 4. 최초 배포 시 딱 한 번, 스프레드시트 접근 권한 승인 팝업이 뜨는데 이건 배포한 "본인"만
  //    한 번 승인하면 됩니다 (팀원들은 이 승인 절차를 겪지 않습니다).
  // ----------------------------------------------------------------------------

  // ============================================================================
  // 시트 열 구조 (A~Q) — 가이드 팝업 / 규격 팝업의 모든 필드가 1:1로 매핑됩니다.
  // ============================================================================
  // A:ID  B:구분(매체|가이드|규격)  C:매체
  // D:가이드명  E:제공방식  F:링크URL  G:파일명  H:파일크기  I:파일데이터(Base64)   ← 가이드 팝업 필드
  // J:지면  K:광고유형  L:항목목록(JSON: [{item,content}])  M:파일형식              ← 규격 팝업 필드
  // N:비고(가이드·규격 공용)  O:수정일시  P:정렬순서(규격 전용)  Q:이미지URL(규격 전용)
  const HEADERS = ["ID","구분","매체","가이드명","제공방식","링크URL","파일명","파일크기","파일데이터",
                    "지면","광고유형","광고사이즈","파일형식","비고","수정일시","정렬순서","이미지URL"];
  const COL = { ID:0, KIND:1, MEDIA:2, TITLE:3, TYPE:4, URL:5, FNAME:6, FSIZE:7, FDATA:8,
                SURFACE:9, ADTYPE:10, ADSIZE:11, FFORMAT:12, NOTE:13, UPDATED:14, ORDER:15, IMAGE:16 };
  const MAX_FILE_BYTES = 29 * 1024; // 구글시트 셀 용량(50,000자) 한도 내에서 base64로 안전하게 들어가는 최대 크기

  const DEFAULT_MEDIA = ["YouTube","Meta / Instagram","네이버 GFA","카카오","TikTok"];
  let media = [];   // [{id, name, rowNumber}]
  let guides = [];  // [{id, media, title, type, url, fileName, fileSize, fileData, hasFile, note, updatedAt, rowNumber}]
  let specs = [];   // [{id, media, surface, adType, items:[{item,content}], fileFormat, image, note, order, updatedAt, rowNumber}]
  let activeMedia = null; // null = 전체보기, 아니면 매체명(string)
  let searchTerm = "";
  let pendingFile = null; // {name, size, base64}

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; };
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function toast(msg){
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove("show"), 2600);
  }
  function formatDate(d){
    const dt = new Date(d);
    const p = n => String(n).padStart(2,"0");
    return `${dt.getFullYear()}.${p(dt.getMonth()+1)}.${p(dt.getDate())}`;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function formatMultiline(s){
    return escapeHtml(s || "").replace(/\n/g, "<br>");
  }
  function isUrl(s){
    return /^https?:\/\/\S+$/i.test((s || "").trim());
  }
  function formatNote(note){
    if(!note) return "";
    const trimmed = note.trim();
    if(isUrl(trimmed)){
      return `<a href="${escapeHtml(trimmed)}" target="_blank" rel="noopener">${escapeHtml(trimmed)}</a>`;
    }
    return formatMultiline(note);
  }
  function isConfigured(v){ return !!v && !v.startsWith("여기에_"); }

  // ============================================================================
  // Apps Script 웹앱 기반 통합 입출력 클라이언트 (GET 조회 / POST로 append·update·delete)
  // 로그인/OAuth/팝업이 전혀 없습니다 — 순수 fetch만으로 통신합니다.
  // ============================================================================
  // GET: 데이터 조회 (?action=read)
  async function gsGet(action, params){
    const qs = new URLSearchParams({ action, ...(params||{}) }).toString();
    const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`, { method: "GET" });
    if(!res.ok) throw new Error("APPS_SCRIPT_HTTP_" + res.status);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "APPS_SCRIPT_ERROR");
    return data;
  }
  // POST: append(생성) / update(수정) / delete(삭제) — 모두 action 필드로 구분
  // Content-Type을 text/plain으로 보내 브라우저의 CORS 프리플라이트(OPTIONS)를 피합니다.
  // Apps Script는 실제 Content-Type과 무관하게 본문(text)을 그대로 JSON.parse 합니다.
  async function gsPost(action, payload){
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, ...payload })
    });
    if(!res.ok) throw new Error("APPS_SCRIPT_HTTP_" + res.status);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "APPS_SCRIPT_ERROR");
    return data;
  }
  async function readAllRows(){
    const data = await gsGet("read");
    const rows = data.values || [];
    return rows.map((r, i) => ({ rowNumber: i + 2, cells: r }));
  }
  // POST (append) — 새 행 1개 이상 추가
  async function appendRows(rowArrays){
    if(!rowArrays.length) return;
    await gsPost("append", { rows: rowArrays });
  }
  // PUT/PATCH 역할 (update) — 지정된 행 번호 하나를 덮어씀
  async function updateRow(rowNumber, rowArray){
    await gsPost("update", { updates: [{ rowNumber, row: rowArray }] });
  }
  // PUT/PATCH 역할 (batch update) — 여러 행을 한 번에 덮어씀
  async function updateRowsBatch(items){ // [{rowNumber, rowArray}]
    if(!items.length) return;
    await gsPost("update", { updates: items.map(it => ({ rowNumber: it.rowNumber, row: it.rowArray })) });
  }
  // DELETE — 지정된 행(들)을 시트에서 완전히 제거
  async function deleteRows(rowNumbers){
    const list = [...new Set(rowNumbers)].filter(Boolean);
    if(!list.length) return;
    await gsPost("delete", { rowNumbers: list });
  }

  // ---------- row(배열) <-> 앱 데이터 모델 변환 ----------
  const ROW_LEN = HEADERS.length;
  function mediaRowArray(m){
    const a = new Array(ROW_LEN).fill("");
    a[COL.ID]=m.id; a[COL.KIND]="매체"; a[COL.MEDIA]=m.name; a[COL.UPDATED]=String(Date.now());
    return a;
  }
  function guideRowArray(g){
    const a = new Array(ROW_LEN).fill("");
    a[COL.ID]=g.id; a[COL.KIND]="가이드"; a[COL.MEDIA]=g.media; a[COL.TITLE]=g.title; a[COL.TYPE]=g.type;
    a[COL.URL]=g.url||""; a[COL.FNAME]=g.fileName||""; a[COL.FSIZE]=g.fileSize||0; a[COL.FDATA]=g.fileData||"";
    a[COL.NOTE]=g.note||""; a[COL.UPDATED]=String(g.updatedAt||Date.now());
    return a;
  }
  function specRowArray(s){
    const a = new Array(ROW_LEN).fill("");
    a[COL.ID]=s.id; a[COL.KIND]="규격"; a[COL.MEDIA]=s.media;
    a[COL.SURFACE]=s.surface||""; a[COL.ADTYPE]=s.adType||"";
    a[COL.ADSIZE]=JSON.stringify(s.items||[]); a[COL.FFORMAT]=s.fileFormat||"";
    a[COL.NOTE]=s.note||""; a[COL.UPDATED]=String(s.updatedAt||Date.now()); a[COL.ORDER]=String(s.order||0);
    return a;
  }
  // 항목 목록 파싱: 새 형식(JSON 배열)을 우선 시도하고, 실패하면(과거에 자유 텍스트로
  // 저장된 데이터) 줄 단위로 "항목: 내용" 패턴을 추정해 자동 변환합니다.
  function parseItemsCell(raw){
    const text = String(raw || "").trim();
    if(!text) return [];
    try{
      const parsed = JSON.parse(text);
      if(Array.isArray(parsed)){
        return parsed.map(it => ({ item: String((it && it.item) || ""), content: String((it && it.content) || "") }));
      }
    }catch(e){ /* not JSON → legacy plain text, fall through */ }
    return text.split("\n").map(line => {
      const m = line.match(/^([^:：]{1,30}[)）]?)\s*[:：]\s*(.+)$/);
      if(m) return { item: m[1].trim(), content: m[2].trim() };
      return { item: "", content: line.trim() };
    }).filter(it => it.item || it.content);
  }
  function parseRows(rawRows){
    media = []; guides = []; specs = [];
    rawRows.forEach(({ rowNumber, cells }) => {
      const c = i => (cells[i] !== undefined && cells[i] !== null) ? cells[i] : "";
      const id = c(COL.ID), kind = c(COL.KIND), mediaName = c(COL.MEDIA);
      if(!id || !kind) return;
      if(kind === "매체"){
        media.push({ id, name: String(mediaName), rowNumber });
      }else if(kind === "가이드"){
        const fileData = String(c(COL.FDATA) || "");
        guides.push({
          id, media: String(mediaName), title: String(c(COL.TITLE)), type: String(c(COL.TYPE) || "link"),
          url: String(c(COL.URL) || ""), fileName: String(c(COL.FNAME) || ""),
          fileSize: Number(c(COL.FSIZE)) || 0, fileData, hasFile: !!fileData,
          note: String(c(COL.NOTE) || ""), updatedAt: Number(c(COL.UPDATED)) || Date.now(), rowNumber
        });
      }else if(kind === "규격"){
        specs.push({
          id, media: String(mediaName), surface: String(c(COL.SURFACE) || ""), adType: String(c(COL.ADTYPE) || ""),
          items: parseItemsCell(c(COL.ADSIZE)), fileFormat: String(c(COL.FFORMAT) || ""),
          note: String(c(COL.NOTE) || ""), updatedAt: Number(c(COL.UPDATED)) || Date.now(),
          order: Number(c(COL.ORDER)) || 0, rowNumber
        });
      }
    });
  }
  function handleSheetError(err){
    console.error(err);
    toast("구글 시트 처리 중 오류가 발생했어요. Apps Script 배포/URL 설정을 확인해주세요.");
  }

  let isLoading = false;
  async function refreshFromSheet(){
    if(!isConfigured(APPS_SCRIPT_URL)){
      $("#guideArea").innerHTML = "";
      $("#guideArea").appendChild(el("div","empty-state",
        `<b>Apps Script 연동이 아직 설정되지 않았어요</b>코드 최상단의 APPS_SCRIPT_URL에 배포한 웹앱 주소를 붙여넣어주세요.`));
      return;
    }
    if(isLoading) return;
    isLoading = true;
    try{
      const rawRows = await readAllRows();
      parseRows(rawRows);
      if(media.length === 0 && guides.length === 0 && specs.length === 0){
        // 완전히 빈 시트라면 기본 매체 목록으로 초기 세팅
        const seed = DEFAULT_MEDIA.map(name => mediaRowArray({ id: uid(), name }));
        await appendRows(seed);
        const rawRows2 = await readAllRows();
        parseRows(rawRows2);
      }
      renderSidebar(); renderGuides(); renderSpecSection();
    }catch(err){
      handleSheetError(err);
    }finally{
      isLoading = false;
    }
  }

  // ---------- rendering ----------
  function renderSidebar(){
    const wrap = $("#mediaList");
    wrap.innerHTML = "";
    const allItem = el("div", "media-item" + (activeMedia===null ? " active" : ""));
    allItem.innerHTML = `<span>전체보기</span><span class="media-count">${guides.length}</span>`;
    allItem.onclick = () => { activeMedia = null; renderSidebar(); renderGuides(); renderSpecSection(); };
    wrap.appendChild(allItem);
    media.forEach(m => {
      const count = guides.filter(g => g.media === m.name).length;
      const item = el("div", "media-item" + (activeMedia===m.name ? " active" : ""));
      item.innerHTML = `<span>${escapeHtml(m.name)}</span>`;
      const right = el("span");
      right.innerHTML = `<span class="media-count">${count}</span> <button class="media-edit" title="매체명 수정">✎</button><button class="media-del" title="매체 삭제">✕</button>`;
      item.appendChild(right);
      item.onclick = (e) => {
        if(e.target.classList.contains("media-del") || e.target.classList.contains("media-edit")) return;
        activeMedia = m.name; renderSidebar(); renderGuides(); renderSpecSection();
      };
      item.querySelector(".media-edit").onclick = async (e) => {
        e.stopPropagation();
        const newName = prompt("새 매체명을 입력해주세요.", m.name);
        if(newName === null) return;
        await renameMedia(m, newName);
      };
      item.querySelector(".media-del").onclick = async (e) => {
        e.stopPropagation();
        if(!confirm(`"${m.name}" 매체를 삭제하면 소속된 가이드 ${count}개와 규격표도 함께 삭제됩니다. 계속할까요?`)) return;
        try{
          toast("삭제하는 중...");
          const rowNumbers = [m.rowNumber,
            ...guides.filter(g=>g.media===m.name).map(g=>g.rowNumber),
            ...specs.filter(s=>s.media===m.name).map(s=>s.rowNumber)];
          await deleteRows(rowNumbers);
          if(activeMedia === m.name) activeMedia = null;
          await refreshFromSheet();
          toast("삭제했어요.");
        }catch(err){ handleSheetError(err); }
      };
      wrap.appendChild(item);
    });
  }
  async function renameMedia(m, newNameRaw){
    const newName = newNameRaw.trim();
    if(!newName || newName === m.name) return;
    if(media.some(x => x.name === newName)){ toast(`"${newName}" 매체가 이미 있어요.`); return; }
    const updates = [{ rowNumber: m.rowNumber, row: mediaRowArray({ id: m.id, name: newName }) }];
    guides.filter(g => g.media === m.name).forEach(g => {
      updates.push({ rowNumber: g.rowNumber, row: guideRowArray({ ...g, media: newName }) });
    });
    specs.filter(s => s.media === m.name).forEach(s => {
      updates.push({ rowNumber: s.rowNumber, row: specRowArray({ ...s, media: newName }) });
    });
    try{
      toast("매체명 수정하는 중...");
      await updateRowsBatch(updates.map(u => ({ rowNumber: u.rowNumber, rowArray: u.row })));
      if(activeMedia === m.name) activeMedia = newName;
      await refreshFromSheet();
      toast("매체명을 수정했어요.");
    }catch(err){ handleSheetError(err); }
  }
  function renderGuides(){
    const area = $("#guideArea");
    const title = $("#mainTitle");
    title.textContent = activeMedia ? activeMedia + " 가이드" : "전체 가이드";
    let list = guides.filter(g => activeMedia===null || g.media===activeMedia);
    if(searchTerm){
      const s = searchTerm.toLowerCase();
      list = list.filter(g => g.title.toLowerCase().includes(s) || (g.note||"").toLowerCase().includes(s) || (g.media||"").toLowerCase().includes(s));
    }
    list = list.slice().sort((a,b)=> b.updatedAt - a.updatedAt);
    area.innerHTML = "";
    if(list.length === 0){
      area.appendChild(el("div","empty-state",
        `<b>등록된 가이드가 없어요</b>상단의 “가이드 추가” 또는 “엑셀로 일괄 업로드”로 시작해보세요.`));
      return;
    }
    const grid = el("div","guide-grid");
    list.forEach(g => grid.appendChild(renderCard(g)));
    area.appendChild(grid);
  }
  function renderCard(g){
    const card = el("div","card");
    const badge = g.type === "file" ? `<span class="type-badge file">FILE</span>` : `<span class="type-badge link">LINK</span>`;
    card.innerHTML = `
      <div class="card-top">
        <span class="card-media-tag">${escapeHtml(g.media || "미분류")}</span>
        <span class="stamp">UPD ${formatDate(g.updatedAt)}</span>
      </div>
      <div>${badge}</div>
      <h3 class="card-title">${escapeHtml(g.title)}</h3>
      ${g.note ? `<p class="card-note">${escapeHtml(g.note)}</p>` : ""}
      <div class="card-actions"></div>
    `;
    const actions = card.querySelector(".card-actions");
    if(g.type === "link"){
      const openBtn = el("a","btn btn-sm btn-primary","열기");
      openBtn.href = g.url || "#";
      openBtn.target = "_blank"; openBtn.rel="noopener";
      actions.appendChild(openBtn);
    }else{
      if(g.hasFile){
        const dlBtn = el("button","btn btn-sm btn-primary","다운로드");
        dlBtn.onclick = () => downloadFile(g);
        actions.appendChild(dlBtn);
      }else{
        actions.appendChild(el("span","missing-file","⚠ 파일 미등록"));
      }
    }
    const editBtn = el("button","btn btn-sm btn-ghost","수정");
    editBtn.onclick = () => openGuideModal(g);
    actions.appendChild(editBtn);
    return card;
  }
  function downloadFile(g){
    if(!g.fileData){ toast("파일을 찾을 수 없어요."); return; }
    try{
      const byteChars = atob(g.fileData);
      const bytes = new Uint8Array(byteChars.length);
      for(let i=0;i<byteChars.length;i++) bytes[i] = byteChars.charCodeAt(i);
      const blob = new Blob([bytes]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = g.fileName || (g.title + ".pdf");
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }catch(e){
      toast("다운로드 중 오류가 발생했어요.");
    }
  }
  // ---------- media add ----------
  $("#btnAddMedia").onclick = async () => {
    const input = $("#newMediaInput");
    const name = input.value.trim();
    if(!name) return;
    if(media.some(m=>m.name===name)){ toast("이미 있는 매체명이에요."); return; }
    try{
      toast("추가하는 중...");
      await appendRows([mediaRowArray({ id: uid(), name })]);
      input.value = "";
      await refreshFromSheet();

  async function exportToExcel(mediaNames){
    toast("엑셀 생성 중...");
    const wb = new ExcelJS.Workbook();
    const yellow = { type:"pattern", pattern:"solid", fgColor:{argb:"FFFFF200"} };
    const thin = { style:"thin", color:{argb:"FFD8D6CD"} };
    const border = { top:thin, left:thin, bottom:thin, right:thin };
    const COLS = 7; // 매체,지면,광고유형,항목,광고사이즈,파일형식,비고
    const usedNames = {};
    mediaNames.forEach(mname => {
      const rows = specs.filter(s => s.media === mname).sort((a,b)=>a.order-b.order);
      if(rows.length===0) return;
      let sheetName = mname.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31) || "Sheet";
      if(usedNames[sheetName]){ usedNames[sheetName]++; sheetName = (sheetName.slice(0,28) + "_" + usedNames[sheetName]); }
      else{ usedNames[sheetName] = 1; }
      const ws = wb.addWorksheet(sheetName);
      ws.columns = [{width:14},{width:16},{width:20},{width:20},{width:36},{width:16},{width:26}];
      ws.mergeCells(1,1,1,COLS);
      const title = ws.getCell(1,1);
      title.value = mname;
      title.fill = yellow;
      title.font = { bold:true, size:14 };
      title.alignment = { vertical:"middle" };
      ws.getRow(1).height = 26;
      const headerRow = 3;
      ["매체","지면","광고유형","항목","광고사이즈","파일형식","비고"].forEach((h,i) => {
        const c = ws.getCell(headerRow, i+1);
        c.value = h;
        c.fill = yellow;
        c.font = { bold:true };
        c.border = border;
        c.alignment = { vertical:"middle", horizontal:"center" };
      });
      let cursor = headerRow + 1;
      const mediaBlockStart = cursor;
      rows.forEach(r => {
        const items = (r.items && r.items.length) ? r.items : [{item:"",content:""}];
        const blockStart = cursor;
        items.forEach(it => {
          const rowIdx = cursor;
          const lineCount = Math.max((it.content||"").split("\n").length, 1);
          if(lineCount > 1) ws.getRow(rowIdx).height = 16 * lineCount;
          [mname, r.surface, r.adType, it.item, it.content, r.fileFormat, r.note || ""].forEach((v,ci) => {
            const c = ws.getCell(rowIdx, ci+1);
            c.value = v;
            c.border = border;
            c.alignment = { vertical:"middle", horizontal: ci===0 ? "center" : "left", wrapText:true };
          });
          cursor++;
        });
        const blockEnd = cursor - 1;
        if(blockEnd > blockStart){
          [2,3,6,7].forEach(ci => ws.mergeCells(blockStart, ci, blockEnd, ci)); // 지면,광고유형,파일형식,비고
        }
        const noteTrimmed = (r.note || "").trim();
        if(/^https?:\/\/\S+$/i.test(noteTrimmed)){
          const noteCell = ws.getCell(blockStart, 7);
          noteCell.value = { text: noteTrimmed, hyperlink: noteTrimmed };
          noteCell.font = { color: { argb: "FF2B4C8C" }, underline: true };
        }
      });
      const mediaBlockEnd = cursor - 1;
      if(mediaBlockEnd > mediaBlockStart){
        ws.mergeCells(mediaBlockStart, 1, mediaBlockEnd, 1);
      }
    });
    if(wb.worksheets.length === 0){ toast("내보낼 규격표가 없어요."); return; }
    try{
      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], {type:"application/octet-stream"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "제작가이드_규격표.xlsx";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast("다운로드 완료");
    }catch(err){
      console.error(err);
      toast("엑셀 생성 중 오류가 발생했어요.");
    }
  }

      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
      const existingMediaNames = new Set(media.map(m=>m.name));
      const newMediaRows = [];
      const newGuideRows = [];
      const updateItems = [];
      let added = 0, updated = 0, skipped = 0;
      const seenNew = new Set(); // media+"||"+title, 같은 파일 안에서 중복 방지
      for(const row of rows){
        const mediaName = String(row["매체명"]||"").trim();
        const title = String(row["가이드명"]||"").trim();
        const typeRaw = String(row["타입(링크/파일)"]||row["타입"]||"").trim();
        const url = String(row["링크URL"]||"").trim();
        const note = String(row["비고"]||"").trim();
        if(!mediaName || !title){ skipped++; continue; }
        if(!existingMediaNames.has(mediaName)){
          newMediaRows.push(mediaRowArray({ id: uid(), name: mediaName }));
          existingMediaNames.add(mediaName);
        }
        const type = typeRaw.includes("파일") ? "file" : "link";
        const key = mediaName + "||" + title;
        const existing = guides.find(g=>g.media===mediaName && g.title===title);
        if(existing && !seenNew.has(key)){
          updateItems.push({ rowNumber: existing.rowNumber, rowArray: guideRowArray({
            ...existing, note: note || existing.note,
            url: type==="link" && url ? url : existing.url,
            type: type==="link" && url ? "link" : existing.type,
            updatedAt: Date.now()
          })});
          updated++;
        }else if(!seenNew.has(key)){
          newGuideRows.push(guideRowArray({
            id: uid(), media: mediaName, title, type,
            url: type==="link" ? url : "", fileName:"", fileSize:0, fileData:"",
            note, updatedAt: Date.now()
          }));
          added++;
        }else{
          skipped++;
        }
        seenNew.add(key);
      }
      toast("구글 시트에 반영하는 중...");
      if(newMediaRows.length) await appendRows(newMediaRows);
      if(newGuideRows.length) await appendRows(newGuideRows);
      if(updateItems.length) await updateRowsBatch(updateItems);
      await refreshFromSheet();
      toast(`엑셀 반영 완료 · 신규 ${added} · 갱신 ${updated} · 건너뜀 ${skipped}`);
    }catch(err){
      console.error(err);
      handleSheetError(err);
    }finally{
      e.target.value = "";
    }
  });

    const wsData = [
      ["매체명","지면","광고유형","항목","광고사이즈","파일형식","비고"],
      ["YouTube","PC/MO","인스트림/쇼츠/인피드","동영상","유튜브 영상 링크","text","유튜브 동영상 URL 전달 필요"],
      ["","","","CTA(필수)","최대 10바이트(한글 2, 영어1)","",""],
      ["","","","광고 제목(선택)","최대 30바이트","",""],
      ["","","","긴 광고 제목(필수)","최대 90바이트","",""],
      ["","","","설명(필수)","최대 70바이트","",""],
      ["Meta / Instagram","피드","이미지","이미지 사이즈","1080x1080px","jpg, png",""]
    ];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws["!cols"] = [{wch:16},{wch:14},{wch:20},{wch:18},{wch:34},{wch:12},{wch:26}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "규격표");
    XLSX.writeFile(wb, "규격표_업로드_템플릿.xlsx");
    toast("같은 규격의 항목이 여러 개면, 아래 행에서 매체명/지면/광고유형/파일형식/비고를 비워두고 항목·광고사이즈만 채워주세요.");
  };
  // ---------- excel: 규격 일괄 업로드 (→ 구글 시트에 직접 반영) ----------
  $("#btnSpecExcelImport").onclick = () => $("#specExcelInput").click();
  $("#specExcelInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
      const existingMediaNames = new Set(media.map(m=>m.name));
      const newMediaRows = [];
      // 매체명이 채워진 행 = 새 규격 블록 시작, 비어있는 행 = 직전 블록의 추가 항목(병합 셀 스타일)
      const parsedSpecs = [];
      let current = null;
      let skippedRows = 0;
      rows.forEach(row => {
        const mediaName = String(row["매체명"]||"").trim();
        const surface = String(row["지면"]||"").trim();
        const adType = String(row["광고유형"]||"").trim();
        const itemName = String(row["항목"]||"").trim();
        const content = String(row["광고사이즈"]||"").trim();
        const fileFormat = String(row["파일형식"]||"").trim();
        const note = String(row["비고"]||"").trim();
        if(mediaName){
          current = { media: mediaName, surface, adType, fileFormat, note, items: [] };
          parsedSpecs.push(current);
          if(!existingMediaNames.has(mediaName)){
            newMediaRows.push(mediaRowArray({ id: uid(), name: mediaName }));
            existingMediaNames.add(mediaName);
          }
        }
        if(!current){ if(itemName || content) skippedRows++; return; }
        if(itemName || content) current.items.push({ item: itemName, content });
      });
      const validSpecs = parsedSpecs.filter(s => s.surface && s.items.length>0);
      skippedRows += parsedSpecs.length - validSpecs.length;
      const newSpecRows = [];
      const updateItems = [];
      let added = 0, updated = 0;
      validSpecs.forEach(s => {
        const existing = specs.find(x => x.media===s.media && x.surface===s.surface && x.adType===s.adType);
        if(existing){
          updateItems.push({ rowNumber: existing.rowNumber, rowArray: specRowArray({
            ...existing, items: s.items, fileFormat: s.fileFormat || existing.fileFormat,
            note: s.note || existing.note, updatedAt: Date.now()
          })});
          updated++;
        }else{
          newSpecRows.push(specRowArray({
            id: uid(), media: s.media, surface: s.surface, adType: s.adType,
            items: s.items, fileFormat: s.fileFormat, note: s.note,
            updatedAt: Date.now(), order: specs.filter(x=>x.media===s.media).length + newSpecRows.length
          }));
          added++;
        }
      });
      toast("구글 시트에 반영하는 중...");
      if(newMediaRows.length) await appendRows(newMediaRows);
      if(newSpecRows.length) await appendRows(newSpecRows);
      if(updateItems.length) await updateRowsBatch(updateItems);
      await refreshFromSheet();
      toast(`규격 반영 완료 · 신규 ${added} · 갱신 ${updated} · 건너뜀 ${skippedRows}`);
    }catch(err){
      console.error(err);
      handleSheetError(err);
    }finally{
      e.target.value = "";
    }
  });
  // ---------- init ----------
  async function init(){
    if(!isConfigured(APPS_SCRIPT_URL)){
      toast("코드 상단 APPS_SCRIPT_URL이 설정되지 않았어요.");
    }
    await refreshFromSheet();
    // 탭이 다시 보일 때마다 가볍게 재동기화 (모달이 열려있지 않을 때만)
    setInterval(() => {
      const anyOpen = document.querySelector(".overlay.open");
      if(!anyOpen && document.visibilityState === "visible") refreshFromSheet();
    }, 30000);
    document.addEventListener("visibilitychange", () => {
      if(document.visibilityState === "visible"){
        const anyOpen = document.querySelector(".overlay.open");
        if(!anyOpen) refreshFromSheet();
      }
    });
  }
  init();
})();
</script>
